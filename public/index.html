<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cabo an der Riss</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Language toggle (always visible) -->
  <button id="lang-toggle" class="lang-fab" title="Toggle language">EN</button>

  <!-- Lobby Screen -->
  <div id="lobby-screen" class="screen active">
    <div class="lobby-container">
      <div class="logo">
        <div class="logo-beaver">&#x1F9AB;</div>
        <h1>Cabo <span class="logo-sub">an der Riss</span></h1>
        <p class="tagline" data-i18n="tagline">Ein Kartenspiel aus Biberach</p>
      </div>

      <div id="join-create">
        <input type="text" id="player-name" data-i18n-placeholder="namePlaceholder" placeholder="Dein Name" maxlength="12" autocomplete="off">
        <button id="create-btn" class="btn btn-primary" data-i18n="createRoom">Raum erstellen</button>
        <div class="divider"><span data-i18n="or">oder</span></div>
        <input type="text" id="room-code-input" data-i18n-placeholder="roomCodePlaceholder" placeholder="Raum-Code" maxlength="4" autocomplete="off">
        <button id="join-btn" class="btn btn-secondary" data-i18n="join">Beitreten</button>
      </div>

      <div id="waiting-room" style="display:none">
        <h2>Raum: <span id="room-code-display"></span></h2>
        <p class="waiting-hint" data-i18n="shareCode">Teile den Code mit deinen Mitspielern</p>
        <ul id="player-list"></ul>
        <div id="lobby-actions" style="display:none">
          <button id="add-bot-btn" class="btn btn-secondary btn-small" data-i18n="addBot">Bot hinzuf&uuml;gen</button>
          <button id="start-btn" class="btn btn-primary" data-i18n="startGame">Spiel starten</button>
        </div>
        <p id="waiting-msg" class="waiting-hint">Warte auf den Gastgeber...</p>
      </div>

      <div id="error-toast" class="toast" style="display:none"></div>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen">

    <div id="game-header">
      <span id="room-info"></span>
      <span id="round-info"></span>
      <span id="scores-toggle" title="Punkte">&#x1F3C6;</span>
    </div>

    <div id="scores-panel" style="display:none">
      <h3 data-i18n="scoresTitle">Punktestand</h3>
      <div id="scores-list"></div>
    </div>

    <!-- Poker Table Layout -->
    <div id="game-table">

      <div id="opponents-area"></div>

      <div id="table-felt">
        <div id="table-piles">
          <div id="deck-area">
            <div id="deck" class="card card-back clickable">
              <div class="card-back-design">
                <div class="card-back-border">
                  <div class="card-back-pattern">&#x1F9AB;</div>
                </div>
              </div>
              <span id="deck-count" class="badge"></span>
            </div>
            <span class="pile-label" data-i18n="deckLabel">Stapel</span>
          </div>
          <div id="discard-area">
            <div id="discard" class="card empty-pile">
              <span class="empty-label" data-i18n="emptyPile">Leer</span>
            </div>
            <span class="pile-label" data-i18n="discardLabel">Ablage</span>
          </div>
        </div>
      </div>

      <div id="drawn-card-area" style="display:none">
        <span id="drawn-label">Gezogen:</span>
        <div id="drawn-card" class="card"></div>
      </div>

      <div id="my-area">
        <div id="my-name-tag"></div>
        <div id="my-cards"></div>
      </div>

    </div>

    <div id="status-bar">
      <div id="status-message"></div>
      <div id="action-buttons"></div>
    </div>

    <div id="cabo-banner" style="display:none">
      <span>CABO!</span>
    </div>

  </div>

  <!-- Reveal Overlay -->
  <div id="reveal-overlay" style="display:none">
    <div class="reveal-content">
      <h2 id="reveal-title">Runde vorbei!</h2>
      <div id="reveal-results"></div>
      <div id="reveal-buttons"></div>
    </div>
  </div>

  <!-- Peek/Spy Overlay -->
  <div id="peek-overlay" style="display:none">
    <div class="peek-content">
      <div id="peek-card" class="card card-large"></div>
      <p id="peek-label"></p>
    </div>
  </div>

  <!-- Rules Overlay -->
  <div id="rules-overlay" style="display:none">
    <div class="rules-content">
      <button id="rules-close" class="btn-close">&times;</button>
      <h2 data-i18n="rulesTitle">Spielregeln</h2>
      <div id="rules-body" class="rules-body"></div>
    </div>
  </div>

  <button id="rules-btn" class="rules-fab" title="Spielregeln">?</button>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="/js/game-engine.js"></script>
  <script src="/js/client.js"></script>
</body>
</html>
